services:
  - type: web
    name: myfitness-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: TRUST_PROXY_HOPS
        value: "2"
      - key: ENABLE_IP_DEBUG
        value: "false"
      - key: CLOUDINARY_MOCK
        value: "false"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_UPLOAD_FOLDER
        value: myfitness/avatars
      - key: RAG_MOCK
        value: "false"
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: EMBEDDING_MODEL
        sync: false
      - key: EMBEDDING_DIMENSIONS
        value: "768"
      - key: RAG_TOP_K
        value: "6"
      - key: LLM_TIMEOUT_MS
        value: "115000"
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: ASSISTANT_DAILY_LIMIT
        value: "5"
      - key: LOGIN_PAIR_LIMIT
        value: "5"
      - key: LOGIN_IP_LIMIT
        value: "20"
      - key: LOGIN_WINDOW_MINUTES
        value: "15"
      - key: SIGNUP_IP_LIMIT
        value: "5"
      - key: SIGNUP_WINDOW_MINUTES
        value: "60"
      - key: GLOBAL_IP_LIMIT
        value: "300"
      - key: GLOBAL_WINDOW_MINUTES
        value: "15"
      - key: ALLOW_MOCK_IN_PROD
        value: "false"
